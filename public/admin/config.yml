backend:
  name: github
  repo: PWMPro-a/my-blog
  branch: main
  base_url: https://decap-oauth-worker.251873620.workers.dev
  auth_endpoint: auth

site_url: https://ximo.qzz.io
display_url: https://ximo.qzz.io
logo_url: https://ximo.qzz.io/favicon.svg
media_folder: public/images/uploads
public_folder: /images/uploads
publish_mode: editorial_workflow
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: '-'

collections:
  - name: blog
    label: 文章
    label_singular: 文章
    folder: src/content/blog
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    preview_path: posts/{{slug}}
    summary: '{{title}} · {{pubDate}}'
    fields:
      - { label: 标题, name: title, widget: string }
      - { label: 描述, name: description, widget: text }
      - { label: 发布时间, name: pubDate, widget: datetime, format: 'YYYY-MM-DD', time_format: false }
      - { label: 更新时间, name: updatedDate, widget: datetime, required: false, format: 'YYYY-MM-DD', time_format: false }
      - label: 标签
        name: tags
        widget: list
        default: []
      - { label: 草稿, name: draft, widget: boolean, default: false }
      - { label: 精选, name: featured, widget: boolean, default: false }
      - { label: 头图, name: heroImage, widget: image, required: false }
      - { label: 正文, name: body, widget: markdown }
  - name: topics
    label: 专题
    label_singular: 专题
    folder: src/content/topics
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    preview_path: topics/{{slug}}
    summary: '{{title}} · {{posts | length}} 篇文章'
    fields:
      - { label: 标题, name: title, widget: string }
      - { label: 描述, name: description, widget: text }
      - { label: 封面图, name: coverImage, widget: image, required: false }
      - { label: 排序, name: order, widget: number, default: 999, value_type: int }
      - { label: 草稿, name: draft, widget: boolean, default: false }
      - label: 相关文章
        name: posts
        widget: relation
        collection: blog
        search_fields: [title, description]
        value_field: '{{slug}}'
        display_fields: [title]
        multiple: true
        required: false
      - { label: 正文, name: body, widget: markdown, required: false }
